# Configuración de Apache para Lantano: formato JSON del log de acceso.
# Se copia en /etc/apache2/conf-available/lantano.conf y se activa con a2enconf lantano (ver el paso 1B de
# DESPLIEGUE.md). Requiere mod_setenvif, que viene activo en Ubuntu.

# Solo el prefijo de la API Key (erp_<hex>); el secreto después del punto nunca se escribe en el log
SetEnvIf X-API-Key "^(erp_[0-9a-f]+)\." api_key_prefijo=$1

# ip: IP de la conexión (%{c}a). ip_real: IP del cliente (%a). Los servidores Apache no están detrás de
# Cloudflare y no usan mod_remoteip, así que las dos son iguales; con mod_remoteip, %a sería la IP del cliente.
# request: línea de petición sin decodificar (%r), de ahí sale la URI; %U viene decodificado.
# request_time: microsegundos (%D); Lantano lo convierte a segundos.
LogFormat "{\"time\":\"%{%Y-%m-%dT%H:%M:%S}t%{%z}t\",\"host\":\"%V\",\"ip\":\"%{c}a\",\"ip_real\":\"%a\",\"method\":\"%m\",\"request\":\"%r\",\"protocol\":\"%H\",\"status\":\"%>s\",\"bytes\":\"%B\",\"referer\":\"%{Referer}i\",\"user_agent\":\"%{User-Agent}i\",\"request_time\":\"%D\",\"api_key\":\"%{api_key_prefijo}e\"}" json_log

# No registrar las conexiones internas de Apache (OPTIONS * cada pocos segundos para despertar sus procesos).
# Se exige además que vengan de la propia máquina, porque cualquiera puede enviar ese user agent.
# Todo CustomLog con json_log debe llevar env=!dontlog, incluido el de 000-default.conf.
SetEnvIfExpr "(-R '127.0.0.0/8' || -R '::1/128') && %{HTTP_USER_AGENT} =~ /\(internal dummy connection\)$/" dontlog

# Para los sitios que no declaran su propio CustomLog
CustomLog ${APACHE_LOG_DIR}/access.log json_log env=!dontlog

